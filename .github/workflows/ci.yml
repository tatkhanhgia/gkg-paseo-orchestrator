# GKG fork CI profile: only static checks and core package tests run here.
# Jobs that need provider API keys, Playwright E2E, Electron packaging, macOS
# runners, Windows runners, or upstream release contracts are disabled until
# those systems are configured. See .github/workflows-disabled/README.md.
name: CI

on:
  push:
    branches: [main]
  # Every base branch, so stacked PRs and PRs into `next` get the same checks.
  pull_request:
  merge_group:
  workflow_dispatch:

# A newer push to the same ref cancels the run still in progress, main included.
# A full run costs about 200 runner-minutes against the org's 20 concurrent
# jobs, and a superseded main run only answers a question the newer commit
# answers again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.filter.outputs.routing != 'false' || steps.filter.outputs.workspace != 'false' || steps.filter.outputs.ci != 'false' }}
      format: ${{ steps.filter.outputs.format }}
      quality: ${{ steps.filter.outputs.quality }}
      hub: ${{ steps.filter.outputs.hub }}
      server: ${{ steps.filter.outputs.server }}
      desktop: ${{ steps.filter.outputs.desktop }}
      app: ${{ steps.filter.outputs.app }}
      sdk: ${{ steps.filter.outputs.sdk }}
      browser: ${{ steps.filter.outputs.browser }}
      relay: ${{ steps.filter.outputs.relay }}
      foundation_cli: ${{ steps.filter.outputs.foundation_cli }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect affected CI contracts
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: .github/ci-paths.yml

      - name: Validate CI contracts
        run: node --test scripts/agent-instructions.test.mjs scripts/ci-workflow.test.mjs scripts/daemon-launch-contract.test.mjs scripts/downstream-publish-guard.test.mjs scripts/sync-fdroid-changelogs.test.mjs scripts/upload-release-assets.test.mjs

  quality:
    name: quality
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false' || needs.changes.outputs.quality != 'false' || needs.changes.outputs.relay != 'false' || needs.changes.outputs.sdk != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        id: install
        run: node scripts/npm-retry.mjs ci

      # Explicit status checks keep independent domains running after a failure.
      # A failed step still fails quality; no continue-on-error or success shim.
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.format != 'false') }}
        run: npm run format:check

      - name: Lint lockfile
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npm audit signatures

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: npm run lint

      - name: Test lint rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
        run: node --test scripts/oxlint/paseo-plugin.test.mjs

      - name: Build relay
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run build:relay

      - name: Run relay tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.relay != 'false') }}
        run: npm run test --workspace=@getpaseo/relay

      - name: Build client dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:relay && npm run build:client

      - name: Build plugin SDK
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run build:plugin

      - name: Run plugin SDK tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/plugin

      - name: Run protocol tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/protocol

      - name: Run client tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/client

      - name: Run highlight tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run test --workspace=@getpaseo/highlight

      - name: Typecheck client examples
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (needs.changes.outputs.full != 'false' || needs.changes.outputs.sdk != 'false') }}
        run: npm run typecheck:examples --workspace=@getpaseo/client

  typecheck:
    name: typecheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.quality != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Verify dependency patch recovery
        run: node --test scripts/postinstall-patches.test.mjs

      - name: Build server stack
        run: npm run build:server

      - name: Verify server build provenance
        run: npm run test:build-provenance --workspace=@getpaseo/server
      - name: Verify built-in plugins from built output
        run: node --test scripts/builtin-plugins-dist.test.mjs

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Run website tests
        run: npx vitest run packages/website/src --bail=1

      - name: Install website test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify website mockups
        run: npm run test:e2e --workspace=@getpaseo/website

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/protocol
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/client
          npm pack --dry-run --ignore-scripts --workspace=@getpaseo/server

  server-tests-ubuntu:
    name: server-tests (ubuntu-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' || needs.changes.outputs.hub != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - &server_capacity
        name: Log runner capacity
        run: |
          node -e "const os = require('node:os'); console.log(JSON.stringify({cpus: os.cpus().length, model: os.cpus()[0].model, ramGiB: os.totalmem() / 2 ** 30}))"

      - &server_checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &server_node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - &server_fetch
        name: Fetch origin/main (worktree tests)
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - &server_install
        name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - &server_agent_clis
        name: Install agent CLIs for provider tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      - &server_build
        name: Build server dependencies
        run: npm run build:server-deps

      - name: Run server tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test --workspace=@getpaseo/server
        env: &server_test_env
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - &server_plugin_tests
        name: Run built-in plugin tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test --workspace=@getpaseo/builtin-plugins

      - &server_hub_contract
        name: Run Hub CLI/daemon contract
        if: ${{ needs.changes.outputs.full == 'false' && needs.changes.outputs.server == 'false' && needs.changes.outputs.hub != 'false' }}
        run: npm run test:hub-cli-contract --workspace=@getpaseo/server

  server-tests-windows:
    name: server-tests (windows-latest)
    needs: changes
    if: false # GKG: disabled — Windows runner not configured for this fork
    runs-on: windows-latest
    steps:
      - *server_capacity
      - *server_checkout
      - *server_node
      - *server_fetch
      - *server_install
      - *server_agent_clis
      - *server_build

      - name: Run server unit tests
        if: ${{ needs.changes.outputs.full != 'false' || needs.changes.outputs.server != 'false' }}
        run: npm run test:unit --workspace=@getpaseo/server
        env: *server_test_env

      - *server_plugin_tests
      - *server_hub_contract

  # Keep the serial integration chain off the Windows unit critical path.
  server-integration-windows:
    name: server-integration (windows-latest)
    needs: changes
    if: false # GKG: disabled — Windows runner not configured for this fork
    runs-on: windows-latest
    steps:
      - *server_capacity
      - *server_checkout
      - *server_node
      - *server_fetch
      - *server_install
      - *server_agent_clis
      - *server_build

      - name: Run server integration tests
        run: npm run test:integration --workspace=@getpaseo/server
        env: *server_test_env

  # native-recursive.ts serves darwin and win32, but windows-latest above is the only
  # runner that exercises it. macOS — the platform the reported watcher bug was on —
  # otherwise has no server-test coverage. Scoped to the observer/watcher suites to
  # bound runtime.
  server-tests-macos:
    name: server-tests (macos-14, file observation)
    needs: changes
    if: false # GKG: disabled — macOS runner not configured for this fork
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Run file observation tests
        run: |
          npm run test:unit --workspace=@getpaseo/server -- \
            src/server/file-observer \
            src/server/workspace-git-service.observation.test.ts \
            src/server/workspace-git-service.observation.integration.test.ts \
            --bail=1

  app-tests:
    name: app-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.app != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Run app unit tests
        run: npm run test --workspace=@getpaseo/app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Android module tests
        run: npm run test:android --workspace=@getpaseo/app

  foundation-cli-macos:
    name: foundation-cli-macos
    needs: changes
    if: false # GKG: disabled — macOS Foundation qualification not configured
    runs-on: macos-14
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Typecheck Foundation CLI
        run: npm run typecheck --workspace=@getpaseo/foundation-cli

      - name: Qualify Foundation installer lifecycle on Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm run test --workspace=@getpaseo/foundation-cli

      - name: Qualify Foundation installer lifecycle on Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm run test --workspace=@getpaseo/foundation-cli

      - name: Qualify Foundation installer lifecycle on Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm run test --workspace=@getpaseo/foundation-cli

      - name: Qualify packaged Foundation lifecycle on Node 24
        run: npm run test:package-lifecycle --workspace=@getpaseo/foundation-cli

      - name: Qualify Foundation installer lifecycle on Node 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: npm run test --workspace=@getpaseo/foundation-cli

      - name: Verify Foundation package contents
        run: npm pack --dry-run --workspace=@getpaseo/foundation-cli

  foundation-cli-portability:
    name: foundation-cli-${{ matrix.platform }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.full != 'false' || needs.changes.outputs.foundation_cli != 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Typecheck Foundation CLI
        run: npm run typecheck --workspace=@getpaseo/foundation-cli

      - name: Test Foundation CLI
        run: npm run test --workspace=@getpaseo/foundation-cli

      - name: Qualify packaged Foundation lifecycle
        run: npm run test:package-lifecycle --workspace=@getpaseo/foundation-cli

  release-qualification:
    name: release-qualification
    needs: changes
    if: false # GKG: disabled — upstream release toolchain contracts not configured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install pinned npm release toolchain
        run: npm install --global npm@11.17.0

      - name: Verify frozen dependency install
        run: npm ci

      - name: Verify release contracts
        run: npm run release:toolchain:check && npm run acp:pin-consistency:check && git diff --exit-code

  cli-tests-1:
    name: cli-tests (shard 1/3)
    needs: changes
    if: false # GKG: disabled — CLI provider tests need agent CLIs and API keys
    runs-on: ubuntu-latest
    env:
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "1"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: &cli_test_steps
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      # The local runner builds its dependencies and shards its own E2E files.
      - name: Run CLI E2E tests
        run: npm run test:local --workspace=@getpaseo/cli

      # Source tests do not read PASEO_CLI_TEST_SHARD. Run them once, on the
      # shortest E2E shard, after its runner has built the server stack.
      - name: Run CLI source tests
        if: ${{ env.PASEO_CLI_TEST_SHARD == '3' }}
        run: npm run test:unit --workspace=@getpaseo/cli

  cli-tests-2:
    name: cli-tests (shard 2/3)
    needs: changes
    if: false # GKG: disabled — CLI provider tests need agent CLIs and API keys
    runs-on: ubuntu-latest
    env:
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "2"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps

  cli-tests-3:
    name: cli-tests (shard 3/3)
    needs: changes
    if: false # GKG: disabled — CLI provider tests need agent CLIs and API keys
    runs-on: ubuntu-latest
    env:
      PASEO_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
      PASEO_DICTATION_ENABLED: "0"
      PASEO_VOICE_MODE_ENABLED: "0"
      PASEO_CLI_TEST_SHARD: "3"
      PASEO_CLI_TEST_SHARD_TOTAL: "3"
    steps: *cli_test_steps
