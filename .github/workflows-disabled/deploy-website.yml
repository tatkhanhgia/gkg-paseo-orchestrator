name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "public-docs/**"
      - "packages/website/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - ".github/workflows/deploy-website.yml"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_DEPLOY_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci --workspace=@getpaseo/website --include-workspace-root

      - name: Typecheck
        run: npm run typecheck --workspace=@getpaseo/website

      - name: Build website
        run: npm run build --workspace=@getpaseo/website

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_DEPLOY_CONFIGURED == 'true'
        run: cd packages/website && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
