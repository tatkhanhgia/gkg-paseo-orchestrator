name: Downstream Portable Qualification / Prerelease

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact commit to qualify, or annotated paseo-v* tag to publish as prerelease"
        required: true
        default: "main"
        type: string
      publish:
        description: "Publish the annotated tag as a GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  portable:
    name: qualify-or-publish-prerelease
    uses: ./.github/workflows/downstream-portable-release-core.yml
    with:
      source_ref: ${{ inputs.ref }}
      tooling_ref: ${{ github.sha }}
      release_tag: ${{ inputs.ref }}
      publish: ${{ inputs.publish }}
      prerelease: true
    permissions:
      contents: write
